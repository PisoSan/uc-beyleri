<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}html,body{margin:0;height:100%}[hidden]{display:none!important}</style>
<title>Uç Beyleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: phone column — header (village + resources), scrolling tab body, bottom tab bar.
   Single deliberate look: night-blue Seljuk tile work — lapis ground, turquoise glaze, gilt accents. */
:root{
  --bg:#0f1829;
  --panel:#16223a;
  --panel-2:#1d2c4a;
  --line:#2a3d62;
  --text:#efe6d2;
  --muted:#9aaac4;
  --firuze:#3cb4a6;
  --gold:#dcaa45;
  --red:#d4583c;
  --green:#6cc08b;
  --display:'Alegreya SC', 'Palatino Linotype', Georgia, serif;
  --body:'Alegreya Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.tabbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg);position:relative}

/* ---------- header ---------- */
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px 8px;display:grid;gap:6px;
  background-image:radial-gradient(circle at 0 0, rgba(60,180,166,.10), transparent 55%)}
.bar1{display:flex;align-items:center;gap:8px;min-width:0}
.vbtn{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left}
.vbtn .vname{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.vbtn .vco{color:var(--muted);font-size:13px;white-space:nowrap}
.vbtn .car{color:var(--gold);font-size:12px}
.ptsb{font-size:13px;color:var(--muted);white-space:nowrap}
.ptsb b{color:var(--gold);font-size:15px}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}
.resbar{display:grid;grid-template-columns:repeat(3,minmax(0,1.12fr)) minmax(0,.88fr);gap:5px}
.rc{background:var(--panel-2);border-radius:10px;padding:4px 5px;display:grid;grid-template-columns:auto 1fr;column-gap:5px;align-items:center;min-width:0}
.rc svg{width:18px;height:18px;grid-row:span 2}
.rc .v{font-weight:800;font-size:14.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .s{font-size:11px;color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc.full .v{color:var(--gold)}
.alert{display:flex;align-items:center;gap:8px;background:rgba(212,88,60,.18);border:1px solid var(--red);color:#ffd6cc;border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.alert .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- body ---------- */
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
main.flush{overflow:hidden;display:flex;flex-direction:column}
.pad{padding:12px 12px 20px;display:grid;gap:12px}
h2.sec{font-family:var(--display);font-size:17px;font-weight:700;margin:4px 0 0;color:var(--gold);letter-spacing:.03em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:13px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.no{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.btn{border:0;border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer;background:var(--gold);color:#23190a;white-space:nowrap}
.btn.sec{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.firuze{background:var(--firuze);color:#062421}
.btn[disabled]{background:var(--panel-2);color:var(--muted);cursor:default;border:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--firuze);width:0}

/* village head */
.vhead{display:flex;gap:12px;align-items:center}
.crest{width:52px;height:52px;flex:none;color:var(--gold)}
.vhead h1{margin:0;font-family:var(--display);font-size:24px;line-height:1.05;text-wrap:balance}
.vhead .meta{font-size:13px;color:var(--muted)}
.note{border-radius:12px;padding:8px 12px;font-size:13.5px;background:rgba(60,180,166,.12);border:1px solid rgba(60,180,166,.45)}
.quest{border-color:rgba(220,170,69,.5);background:linear-gradient(135deg, rgba(220,170,69,.12), transparent 60%), var(--panel)}
.quest .qh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.quest .qh span{font-size:12px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.quest .qt{font-weight:700;font-size:16px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* queue */
.qi{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.qi .bar{grid-column:1 / -1}
.qi b{font-weight:700}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}

/* building rows */
.blist{display:grid;gap:8px}
.brow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 10px}
.brow.locked{opacity:.62}
.bic{width:40px;height:40px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--firuze);grid-row:span 2}
.bic svg{width:24px;height:24px}
.bt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bt b{font-family:var(--display);font-size:17px;font-weight:700}
.lv{font-size:12px;font-weight:800;color:#062421;background:var(--firuze);border-radius:6px;padding:0 6px}
.lv.zero{background:var(--panel-2);color:var(--muted)}
.bd{font-size:13px;color:var(--muted)}
.bfoot{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.why{font-size:12.5px;color:var(--muted);width:100%}

.scene{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#5a7a37;position:relative}
#scene{display:block;width:100%;cursor:pointer;touch-action:manipulation}
.scene figcaption{position:absolute;left:8px;bottom:6px;font-size:11.5px;background:rgba(15,24,41,.7);padding:1px 8px;border-radius:8px;color:var(--muted);pointer-events:none}
.brow.hl{animation:hl 1.6s ease-out}
@keyframes hl{0%{border-color:var(--gold);box-shadow:0 0 0 3px rgba(220,170,69,.35)}100%{border-color:var(--line);box-shadow:none}}

.bsh{display:flex;gap:10px;align-items:center}
.bic.sm{width:32px;height:32px;border-radius:8px;flex:none}
.bic.sm svg{width:19px;height:19px}
.blist2 button{align-items:center;justify-content:flex-start;gap:10px}
.blist2 .bl{flex:1;display:grid;text-align:left}
.req{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.req .ok{color:var(--green)} .req .no{color:var(--red)}
.btn.wide{width:100%;padding:10px 12px;font-size:16px}
.tbl td.up{color:var(--green);font-weight:700}
.fort{border-color:rgba(220,170,69,.45)}
.fstats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fstats div{background:var(--panel-2);border-radius:10px;padding:6px 8px;display:grid}
.fstats span{font-size:12px;color:var(--muted)}
.fstats b{font-size:18px}

.tier{display:grid;gap:6px}
.tier-h{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--firuze)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.tech{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:5px;align-content:start;min-width:0}
.tech.has{border-color:rgba(60,180,166,.55)} .tech.busy{border-color:var(--gold)}
.tech .tt{display:flex;justify-content:space-between;gap:6px;align-items:center}
.pips{display:flex;gap:3px} .pips i{width:7px;height:7px;border-radius:2px;background:var(--line);display:block} .pips i.on{background:var(--firuze)}
.tech .btn{justify-self:start;padding:5px 10px}
.ctag{font-size:11px;font-weight:800;color:var(--firuze);border:1px solid rgba(60,180,166,.5);border-radius:5px;padding:0 4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:9px;padding:7px 0;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer;position:relative}
.seg button.on{background:var(--panel-2);color:var(--gold)}
.seg .dotn{position:absolute;top:4px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.chatwrap{display:flex;flex-direction:column;min-height:0;flex:1}
.chatlog{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:86%;background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:5px 10px}
.msg.me{align-self:flex-end;background:rgba(60,180,166,.14);border-color:rgba(60,180,166,.4);border-radius:12px 12px 4px 12px}
.msg.sys{align-self:center;background:none;border:0;color:var(--muted);font-size:12.5px;font-style:italic;text-align:center;max-width:100%}
.msg .mh{display:flex;gap:6px;align-items:baseline;font-size:12px}
.msg .mh b{font-size:13px}
.msg .mt{font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.chatin{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.chatin input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit}
.klanhead{display:flex;gap:10px;align-items:center}
.klanhead .shield{width:46px;height:52px;flex:none}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.form2{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:6px}
.form2 input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit;min-width:0}

.vscreen{position:relative;flex:1;min-height:0;overflow:hidden;background:#0c1422}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud-top{position:absolute;top:8px;left:10px;right:60px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.vtitle{background:rgba(15,24,41,.82);border:1px solid var(--line);border-radius:12px;padding:4px 10px;display:grid;line-height:1.15}
.vtitle b{font-family:var(--display);font-size:17px}
.vtitle span{font-size:11.5px;color:var(--muted)}
.hchip{background:rgba(60,180,166,.2);border:1px solid rgba(60,180,166,.55);border-radius:10px;padding:5px 9px;font-size:12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.zoomctl{position:absolute;top:8px;right:10px;display:grid;gap:6px}
.zoomctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(15,24,41,.86);color:var(--text);font-size:22px;font-weight:700;display:grid;place-items:center;cursor:pointer}
.zoomctl svg{width:18px;height:18px}
.zoomctl button.off{color:var(--muted);border-style:dashed}
.hud-bot{position:absolute;left:8px;right:8px;bottom:8px;display:grid;gap:6px;pointer-events:none}
.hud-bot > *{pointer-events:auto}
.qchip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(15,24,41,.88);border:1px solid rgba(220,170,69,.45);border-radius:12px;padding:6px 10px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.qchip.done{border-color:var(--green)}
.qchip div:first-child{display:grid;min-width:0}
.qchip span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800}
.qchip b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.qc{flex:none;min-width:130px;text-align:left;background:rgba(15,24,41,.88);border:1px solid var(--line);border-radius:12px;padding:5px 9px;display:grid;gap:2px;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.qc b{font-size:12.5px;white-space:nowrap} .qc span{font-size:12px;color:var(--firuze);font-weight:700}
.qc.tq span{color:var(--gold)} .qc.idle{color:var(--muted);font-size:12.5px;cursor:default}
.qc .bar{height:3px;display:block;border-radius:2px;background:var(--panel-2);overflow:hidden}
.qc .bar i{display:block;height:100%;background:var(--firuze)}
.hbtns{display:flex;gap:6px;justify-content:flex-end}
.hbtns .btn{background:rgba(15,24,41,.88);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hbtns .btn.firuze{background:var(--firuze);color:#062421}
.pop{position:absolute;left:0;top:0;width:min(300px,calc(100% - 16px));background:rgba(22,34,58,.97);border:1px solid rgba(220,170,69,.55);border-radius:14px;padding:9px 11px;display:grid;gap:6px;box-shadow:0 10px 28px rgba(0,0,0,.45);z-index:5}
.pop .ph{display:flex;align-items:center;gap:8px}
.pop .pt{flex:1;display:grid;line-height:1.15}
.pop .pt b{font-family:var(--display);font-size:18px}
.pop .x{font-size:20px}
.pst{font-size:12.5px;font-weight:700;color:var(--muted)} .pst.ok{color:var(--green)} .pst.build{color:var(--firuze)}
.prow{display:grid;gap:3px}
.prow div{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.prow span{color:var(--muted)} .prow em{font-style:normal;color:var(--green)}
.pbtns{display:flex;gap:6px} .pbtns .btn{flex:1;padding:8px 8px}
.pop .req{font-size:12px}

.mkrow{display:grid;grid-template-columns:70px minmax(0,1fr) 84px;gap:6px;align-items:center}
.rsels{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.rsel{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.rsel.on{border-color:var(--gold);color:var(--text);background:rgba(220,170,69,.14)}
.mkf .rsel{padding:3px 7px;font-size:11.5px}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.offer:first-of-type{border-top:0}
.offer .ofw{grid-column:1/-1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offer .ofr{font-size:13px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.offer .ofr em{font-style:normal;font-weight:800;font-size:11.5px}
@media (max-width:360px){.mkrow{grid-template-columns:1fr}}

/* army */
.ugrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ucell{background:var(--panel-2);border-radius:10px;padding:5px 6px;min-width:0}
.ucell .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ucell .c{font-weight:800;font-size:17px}
.urow{border-top:1px solid var(--line);padding-top:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}
.urow:first-of-type{border-top:0;padding-top:0}
.urow .nm{font-weight:700;font-size:16px}
.urow .st{font-size:12px;color:var(--muted)}
.urow .ctl{grid-column:1 / -1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.urow .ctl .chips{width:100%}
.urow .ctl input.qty{flex:1;min-width:60px;max-width:120px}
.urow.locked{opacity:.55}
input.qty{width:74px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text);font:inherit;font-weight:700}
.maxb{background:none;border:1px dashed var(--line);border-radius:8px;padding:5px 8px;color:var(--muted);cursor:pointer;font-size:13px}
.mv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.mv:first-child{border-top:0}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;text-transform:uppercase;letter-spacing:.04em}
.tag.att{background:rgba(220,170,69,.2);color:var(--gold)}
.tag.ret{background:rgba(108,192,139,.2);color:var(--green)}
.tag.inc{background:rgba(212,88,60,.25);color:#ffb9a8}
.tag.spy{background:rgba(60,180,166,.2);color:var(--firuze)}
.tag.sup{background:rgba(154,170,196,.2);color:var(--muted)}
.mv .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* map */
.mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(22,34,58,.94);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mapcard h3{margin:0;font-family:var(--display);font-size:19px;line-height:1.1}
.mapbtns{position:absolute;top:10px;right:10px;display:grid;gap:6px}
.mvpanel{position:absolute;top:10px;left:10px;width:min(205px,calc(100% - 70px));display:grid;gap:3px;z-index:3}
.mvhead{display:flex;align-items:center;gap:6px;background:rgba(12,18,32,.9);border:1px solid var(--line);border-radius:9px;padding:4px 8px;cursor:pointer;color:var(--text);font:inherit;text-align:left}
.mvhead span{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);flex:1;white-space:nowrap}
.mvhead b{font-size:12px} .mvhead .mvinc{color:#ff7a66;font-size:11px} .mvhead i{font-style:normal;color:var(--muted);font-size:11px}
.mvrow{display:grid;grid-template-columns:15px minmax(0,1fr) auto;gap:1px 6px;align-items:center;text-align:left;background:rgba(12,18,32,.88);border:0;border-left:3px solid #e8b64a;border-radius:8px;padding:3px 7px 3px 6px;cursor:pointer;color:var(--text);font:inherit}
.mvrow svg{width:14px;height:14px;color:#e8b64a}
.mvrow.spy{border-left-color:#3cb4a6} .mvrow.spy svg{color:#3cb4a6}
.mvrow.support{border-left-color:#8fb0e8} .mvrow.support svg{color:#8fb0e8}
.mvrow.return{border-left-color:#6cc08b} .mvrow.return svg{color:#6cc08b}
.mvrow.inc{border-left-color:#ff5a44;background:rgba(80,18,14,.92)} .mvrow.inc svg{color:#ff7a66}
.mvt{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mvt em{font-style:normal;font-weight:600;color:var(--muted);font-size:11px}
.mvrow > b{font-size:12px}
.mvbar{grid-column:1/-1;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;display:block}
.mvbar i{display:block;height:100%;background:currentColor;width:0}
.mvrow .mvbar{color:#e8b64a} .mvrow.spy .mvbar{color:#3cb4a6} .mvrow.support .mvbar{color:#8fb0e8} .mvrow.return .mvbar{color:#6cc08b} .mvrow.inc .mvbar{color:#ff5a44}

  kervan:   { n: 'Kervancılık',       d: 'Taşınan ganimet seviye başına +%10',        max: 5, c: [700, 600, 500],  t: 1400, e: .10, req: { medrese: 3, depo: 1 } },

  zirh:     { n: 'Zırh Yapımı',       d: 'Asker savunması seviye başına +%5',         max: 5, c: [800, 700, 900],  t: 1800, e: .05, req: { medrese: 4, demirci: 1 } },
  burc:     { n: 'Burç Mühendisliği', d: 'Sur savunma bonusu seviye başına +%10',     max: 5, c: [600, 1100, 500], t: 2000, e: .10, req: { medrese: 5, mimari: 2 } },

const TECH_ORDER = ['ocak', 'mimari', 'depo', 'talim', 'nal', 'kervan', 'demirci', 'zirh', 'burc', 'sancak'];
const techCost = (id, l) => TECH[id].c.map(x => Math.round(x * Math.pow(1.45, l - 1)));
const techTime = (id, l, med) => TECH[id].t * 1000 * Math.pow(1.35, l - 1) * Math.pow(.95, Math.max(0, med - 1)) / S.speed;
const TL = (o, id) => { if (o === 'P') return S.tech ? (S.tech[id] || 0) : 0; if (!o) return 0; const b = beyOf(o); return b && b.human && b.tech ? (b.tech[id] || 0) : 0; };
const TX = (o, id) => TL(o, id) * TECH[id].e;

// ---------- formüller ----------
const bCost = (b, l) => B[b].c.map(x => Math.round(x * Math.pow(B[b].f, l - 1)));
const prodL = l => (l <= 0 ? 5 : 30 * Math.pow(1.163, l - 1));
const capL = l => Math.round(1000 * Math.pow(1.2294, Math.max(0, l - 1)));
const popL = l => Math.round(240 * Math.pow(1.172, Math.max(0, l - 1)));
function vPoints(v) { let p = 0; for (const b of B_ORDER) for (let l = 1; l <= v.b[b]; l++) p += Math.round(B_PTS[b] * Math.pow(1.2, l - 1)); return p; }
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ---------- durum ----------
let S = null;
let log = () => {};          // arayüz bildirimleri için kanca
const hooks = { notify: (kind, msg) => log(kind, msg) };

const bTime = (b, l, k, o) => B[b].t * 1000 * Math.pow(1.2, l - 1) * Math.pow(0.95, Math.max(0, k - 1)) * (1 - TX(o, 'mimari')) / S.speed;
const uTime = (u, l, o) => U[u].t * 1000 * Math.pow(0.94, Math.max(0, l - 1)) * (1 - TX(o, 'talim')) / S.speed;
const rateH = (v, i) => prodL(v.b[MINES[i]]) * S.speed * (1 + TX(v.owner, 'ocak'));       // saatlik
const cap = v => Math.round(capL(v.b.ambar) * (1 + TX(v.owner, 'depo')));
const popMax = v => popL(v.b.ciftlik);

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function mkVillage(id, x, y, name, owner, b, units, res, t) {
  const bb = {}; for (const k of B_ORDER) bb[k] = 0; Object.assign(bb, b);
  return { id, x, y, name, owner, b: bb, res: res.slice(), rt: t, loy: 100, lt: t, units: Object.assign({}, units),
    bq: [], rq: { kisla: [], ahir: [], tophane: [], divan: [] }, base: null };
}

function newGame(opts) {
  const t = opts.now;
  const seed = opts.seed != null ? opts.seed : Math.floor(Math.random() * 1e9);
  const rnd = mulberry32(seed);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  S = { ver: 1, rs: seed ^ 0x5bd1e995, mp: !!opts.mp, market: [], tech: {}, techq: null, clan: null, chat: { genel: [], klan: [] }, chatq: [], chatSeen: { genel: 0, klan: 0 }, nextChat: t + 30000, seed, speed: opts.speed, created: t, lastT: t, protectUntil: t + 3 * 24 * HOUR / opts.speed,
    nextAi: t + HOUR / opts.speed, uid: 100, player: { name: opts.name || 'Kızılırmak Beyliği', color: '#e3b341' },
    beys: [], vil: [], moves: [], reports: [], quests: { claimed: [] },
    stats: { trained: {}, barbWins: 0, spies: 0 }, cur: 0, over: false };
  const names = PLACE.slice().sort(() => rnd() - .5);
  const taken = [];
  const free = (x, y, min) => x >= 0 && y >= 0 && x < WORLD && y < WORLD && taken.every(p => Math.hypot(p.x - x, p.y - y) >= min);
  const place = (test, min) => { for (let i = 0; i < 4000; i++) { const x = ri(0, WORLD - 1), y = ri(0, WORLD - 1); if (free(x, y, min) && test(x, y)) { taken.push({ x, y }); return { x, y }; } } return null; };

  const pp = place((x, y) => Math.abs(x - 12) <= 2 && Math.abs(y - 12) <= 2, 0);
  const pv = mkVillage(0, pp.x, pp.y, opts.village || 'Kızılcahamam', 'P',
    { konak: 1, kereste: 1, tas: 1, demir: 1, ambar: 1, ciftlik: 1 }, {}, [500, 500, 400], t);
  S.vil.push(pv);
  S.test = opts.test || null;
  if (opts.test === 'full') { for (const m of MINES) pv.b[m] = B[m].max; pv.b.ambar = B.ambar.max; pv.b.ciftlik = 20; }
  if (opts.test === 'max') { for (const b of B_ORDER) pv.b[b] = B[b].max; }
  if (opts.test) pv.res = [1e9, 1e9, 1e9];   // syncRes ambar sınırına indirir

  BEY_DEFS.forEach((d, i) => {
    const ac = AI_CLANS.find(c => c.m.includes('B' + i));
    S.beys.push({ id: 'B' + i, name: d.name, color: d.color, aggr: d.aggr, lastHitP: 0, clan: ac ? ac.tag : null, clanName: ac ? ac.name : null });
    const p = place((x, y) => { const dd = Math.hypot(x - pp.x, y - pp.y); return dd >= 5 && dd <= 11; }, 4);
    if (!p) return;
    const v = mkVillage(S.vil.length, p.x, p.y, d.name.replace('oğulları', '') + ' Hisarı', 'B' + i,
      { konak: 3, kereste: ri(3, 4), tas: ri(3, 4), demir: 3, ambar: 3, ciftlik: 3, kisla: 2, sur: 1 },
      { mizrakli: 20, baltaci: 10 }, [800, 800, 700], t);
    S.vil.push(v);
  });

  let n = 0;
  while (n < 34) {
    const p = place(() => true, 1.9); if (!p) break;
    const dd = Math.hypot(p.x - pp.x, p.y - pp.y), far = Math.min(1, dd / 12);
    const v = mkVillage(S.vil.length, p.x, p.y, names[n % names.length], null,
      { konak: ri(1, 3), kereste: ri(1, 3 + Math.round(far * 4)), tas: ri(1, 3 + Math.round(far * 4)), demir: ri(1, 2 + Math.round(far * 4)),
        ambar: ri(2, 3 + Math.round(far * 3)), ciftlik: ri(2, 4), sur: ri(0, Math.round(far * 3)) },
      {}, [ri(200, 900), ri(200, 900), ri(150, 700)], t);
    v.base = { mizrakli: ri(2, 6 + Math.round(far * 20)), okcu: ri(0, Math.round(far * 10)) };
    Object.assign(v.units, v.base);
    S.vil.push(v); n++;
  }
  // köy adları tekil olsun
  S.vil.forEach((v, i) => { if (v.owner === null) v.name = names[(i + 3) % names.length]; });
  aiMarket(t); aiMarket(t);
  return S;
}

// ---------- tembel (lazy) hesaplama ----------
function syncRes(v, t) {
  const c = cap(v);
  for (let i = 0; i < 3; i++) if (v.res[i] > c * 50) v.res[i] = c;
  const dt = t - v.rt; if (dt <= 0) return;
  for (let i = 0; i < 3; i++) if (v.res[i] < c) v.res[i] = Math.min(c, v.res[i] + rateH(v, i) * dt / HOUR);
  v.rt = t;
}
function syncLoy(v, t) { const dt = t - v.lt; if (dt > 0) { v.loy = Math.min(100, v.loy + dt * S.speed / HOUR); v.lt = t; } }
const afford = (v, c) => c.every((x, i) => v.res[i] >= x);
const pay = (v, c, k = 1) => { for (let i = 0; i < 3; i++) v.res[i] -= c[i] * k; };
const vil = id => S.vil[id];
const unitSum = u => Object.values(u).reduce((a, b) => a + (b || 0), 0);

function popUsed(v) {
  let p = 0;
  for (const b of B_ORDER) p += B[b].pop * v.b[b];
  for (const q of v.bq) p += B[q.b].pop;
  for (const [u, n] of Object.entries(v.units)) p += U[u].pop * n;
  for (const m of S.moves) if (m.from === v.id && m.owner === v.owner && m.type !== 'support') for (const [u, n] of Object.entries(m.units)) p += U[u].pop * n;
  for (const k of REC_B) for (const q of v.rq[k]) p += U[q.u].pop * q.n;
  return p;
}
const popFree = v => popMax(v) - popUsed(v);
const effLevel = (v, b) => v.b[b] + v.bq.filter(q => q.b === b).length;
const reqMet = (v, req) => Object.entries(req).every(([k, l]) => v.b[k] >= l);

// ---------- oyuncu (ve yapay zekâ) hamleleri ----------
// Her hamle hata kodu ya da 'ok' döner. Online sürümde bu fonksiyonlar sunucuda çalışır.
function medreseMax() { return Math.max(0, ...S.vil.filter(v => v.owner === 'P').map(v => v.b.medrese || 0)); }
function canResearch(v, id) {
  const T = TECH[id], l = (S.tech[id] || 0) + 1;
  if (l > T.max) return { ok: false, why: 'max' };
  const med = v.b.medrese || 0;
  for (const [k, x] of Object.entries(T.req)) { if (k === 'medrese' ? med < x : (S.tech[k] || 0) < x) return { ok: false, why: 'req', lvl: l }; }
  if (S.techq) return { ok: false, why: 'busy', lvl: l };
  const c = techCost(id, l);
  if (c.some(x => x > cap(v))) return { ok: false, why: 'cap', c, lvl: l };
  if (!afford(v, c)) return { ok: false, why: 'res', c, lvl: l };
  return { ok: true, c, lvl: l };
}
function research(v, id, t) {
  syncRes(v, t);
  const r = canResearch(v, id); if (!r.ok) return r.why;
  pay(v, r.c);
  S.techq = { id, lvl: r.lvl, vil: v.id, start: t, done: t + techTime(id, r.lvl, v.b.medrese) };
  return 'ok';
}
// eski kayıtları yeni sürüme taşır
function migrate(st) {
  if (!st.market) st.market = [];
  if (!st.tech) st.tech = {};
  if (!st.chat) { st.chat = { genel: [], klan: [] }; st.chatq = []; st.chatSeen = { genel: 0, klan: 0 }; st.nextChat = st.lastT + 30000; st.clan = null;
    st.beys.forEach((b, i) => { const ac = AI_CLANS.find(c => c.m.includes('B' + i)); b.clan = ac ? ac.tag : null; b.clanName = ac ? ac.name : null; }); }
  if (st.techq === undefined) st.techq = null;
  if (st.rs == null) st.rs = (st.seed || 1) ^ 0x5bd1e995;
  for (const v of st.vil) { if (v.b.medrese == null) v.b.medrese = 0; if (v.b.kervansaray == null) v.b.kervansaray = 0; }
  return st;
}
function canUpgrade(v, b) {
  const lvl = effLevel(v, b) + 1;
  if (lvl > B[b].max) return { ok: false, why: 'max' };
  if (!reqMet(v, reqFor(b, lvl))) return { ok: false, why: 'req', lvl };
  if (v.bq.length >= 2) return { ok: false, why: 'queue' };
  const c = bCost(b, lvl);
  if (c.some(x => x > cap(v))) return { ok: false, why: 'cap', c, lvl };
  if (B[b].pop > popFree(v)) return { ok: false, why: 'pop', c, lvl };
  if (!afford(v, c)) return { ok: false, why: 'res', c, lvl };
  return { ok: true, c, lvl };
}
function upgrade(v, b, t) {
  syncRes(v, t);
  const r = canUpgrade(v, b); if (!r.ok) return r.why;
  pay(v, r.c);
  const start = v.bq.length ? v.bq[v.bq.length - 1].done : t;
  v.bq.push({ b, lvl: r.lvl, start, done: start + bTime(b, r.lvl, v.b.konak, v.owner), c: r.c });

// ---------- KÖY MANZARASI (izometrik, dokulu, ışık ve gölgeli) ----------
// Mantıksal sahne 720x440. Dünya koordinatı (u, v, z): u sağ-aşağı, v sol-aşağı, z yukarı.
// Durağan katman (zemin, gölgeler, binalar) yalnızca köy değişince yeniden çizilir;
// hareketli katman (duman, bayrak, köylü, su, at) her karede üstüne çizilir.
const SC = { W: 820, H: 1040, hits: [], raf: 0, last: 0, flash: null, stat: null, sig: '', anims: [], wins: [] };

function P(u, v, z = 0) { const p = Pq(u, v, z); if (MODE === 'draw') trackPt(p.x, p.y); return p; }
const RX = r => r * TW / Math.SQRT2, RY = r => r * TH / Math.SQRT2;

// ---------- dokular ----------
function mkTex(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }

    const k = w / s; let x = rnd() * w;

}

function unitTable(r) {
  const us = C.U_ORDER.filter(u => (r.aUnits[u] || 0) || (r.dUnits && r.dUnits[u]));
  const rows = us.map(u => `<tr><td>${C.U[u].n}</td><td>${r.aUnits[u] ? fmt(r.aUnits[u]) : '–'}${r.aLost[u] ? ` <span class="loss">−${fmt(r.aLost[u])}</span>` : ''}</td><td>${r.dUnits ? (r.dUnits[u] ? fmt(r.dUnits[u]) : '–') + (r.dLost[u] ? ` <span class="loss">−${fmt(r.dLost[u])}</span>` : '') : '?'}</td></tr>`).join('');
  return `<div class="tblwrap"><table class="tbl num"><thead><tr><th>Birlik</th><th>${esc(r.attName)}</th><th>${esc(r.defName)}</th></tr></thead><tbody>${rows || '<tr><td colspan="3" class="muted">Savunmada kimse yoktu.</td></tr>'}</tbody></table></div>`;
}
function repDetail(r) {
  let h = `<div class="rdet">`;
  h += `<div class="small muted">${esc(C.ownerName(r.attOwner))} → ${esc(C.ownerName(r.defOwner))}${r.type !== 'spy' ? ` · şans ${r.luck >= 0 ? '+' : ''}${Math.round(r.luck * 100)}%` : ''}</div>`;
  h += unitTable(r);
  if (!r.dUnits) h += `<div class="small muted">Hiçbir askerin geri dönmedi, düşman ordusunu göremedin.</div>`;
  if (r.wall[0] !== r.wall[1]) h += `<div class="small">Sur ${r.wall[0]} → ${r.wall[1]}</div>`;
  if (r.loy) h += `<div class="small">Bağlılık ${r.loy[0]} → ${r.loy[1]}${r.conquered ? ' · <b style="color:var(--gold)">köy el değiştirdi</b>' : ''}</div>`;
  if (r.type !== 'spy' && r.win) h += `<div class="chips small"><span class="muted">Ganimet:</span>${costChips(r.loot)}</div>`;
  if (r.spy) {
    h += `<div class="card" style="padding:8px 10px"><b>Keşif bilgisi</b><div class="chips">${costChips(r.spy.res)}</div>
      <div class="small muted">${C.B_ORDER.filter(b => r.spy.b[b]).map(b => C.B[b].n + ' ' + r.spy.b[b]).join(' · ')}</div>
      <div class="small">Bağlılık ${r.spy.loy}</div></div>`;
  }
  if (r.attOwner === 'P' && r.defOwner !== 'P') h += `<div><button class="btn sec" data-again="${r.to}">Haritada göster</button></div>`;
  return h + `</div>`;
}
$('view').addEventListener('click', e => {
  if (tab !== 'rapor') return;
  const b = e.target.closest('[data-rep]');
  if (b) { const id = +b.dataset.rep, r0 = S.reports.find(x => x.id === id), k = r0 && repKey(r0); act(() => { const r = S.reports.find(x => repKey(x) === k); if (r) r.read = true; }); openRep = openRep === id ? null : id; save(); render(); return; }
  const a = e.target.closest('[data-again]');
  if (a) { map.sel = +a.dataset.again; tab = 'harita'; renderTabs(); sig = ''; map.ox = null; render(); setTimeout(() => { centerOn(S.vil[map.sel]); drawMap(); }, 0); }
});

// ---------- KLAN ----------
let klanSub = 'bilgi', chatRendered = { ch: null, last: 0 };
const SHIELD = tag => `<svg class="shield" viewBox="0 0 46 52" aria-hidden="true"><path d="M23 2l20 7v14c0 14-9 22-20 27C12 45 3 37 3 23V9z" fill="#16223a" stroke="#dcaa45" stroke-width="2"/><path d="M23 9l13 4.5v9.5c0 9-6 14.5-13 18-7-3.5-13-9-13-18v-9.5z" fill="#3cb4a6" opacity=".25"/><text x="23" y="30" text-anchor="middle" font-family="Alegreya SC, Georgia, serif" font-weight="800" font-size="13" fill="#dcaa45">${esc(tag)}</text></svg>`;
function renderKlan() {
  const view = $('view'); view.classList.add('flush');
  const unread = ch => S.chat[ch].some(m => m.id > (S.chatSeen[ch] || 0) && m.from !== 'P');
  const seg = `<div style="padding:10px 12px 0"><div class="seg">${[['bilgi', 'Klan'], ['klan', 'Klan sohbeti'], ['genel', 'Genel sohbet']].map(([k, n]) => `<button class="${klanSub === k ? 'on' : ''}" data-sub="${k}">${n}${k !== 'bilgi' && klanSub !== k && unread(k) ? '<span class="dotn"></span>' : ''}</button>`).join('')}</div></div>`;
  if (klanSub === 'bilgi') { view.innerHTML = seg + `<div style="flex:1;overflow-y:auto">${klanInfoHTML()}</div>`; chatRendered = { ch: null, last: 0 }; return; }
  const ch = klanSub;
  if (ch === 'klan' && !S.clan) { view.innerHTML = seg + `<div class="pad"><div class="card muted">Klan sohbeti için önce bir klana katıl ya da kendi klanını kur.</div></div>`; return; }
  view.innerHTML = seg + `<div class="chatwrap"><div class="note small" style="margin:8px 12px 0">${MPX ? (ch === 'klan' ? 'Klanındaki gerçek oyuncular burada yazışır.' : 'Dünyadaki gerçek oyuncular ve bilgisayar beyleri burada konuşur.') : 'Bu modda sohbetteki beyler bilgisayar tarafından yönetiliyor. Arkadaşlarla oynarken burada gerçek oyuncular olur.'}</div>
    <div class="chatlog" id="chatlog"></div>
    <form class="chatin" id="chatForm"><input id="chatIn" maxlength="200" autocomplete="off" placeholder="${ch === 'klan' ? '[' + esc(S.clan.tag) + '] klanına yaz' : 'Herkese yaz'}" aria-label="Mesaj"><button class="btn" type="submit">Gönder</button></form></div>`;
  chatRendered = { ch, last: 0 };
  $('chatForm').addEventListener('submit', e => {
    e.preventDefault(); const inp = $('chatIn'), txt = inp.value, r = act(() => C.playerSay(ch, txt, now()));
    if (r === 'ok') { inp.value = ''; save(); liveChat(); }
  });
  liveChat();
}
function msgHTML(m) {
  if (m.from === 'SYS') return `<div class="msg sys">${esc(m.text)} · ${clock(m.t)}</div>`;
  const me = m.from === 'P', tag = C.clanOf(m.from);
  return `<div class="msg${me ? ' me' : ''}"><div class="mh"><b style="color:${C.ownerColor(m.from)}">${esc(me ? S.player.name : C.ownerName(m.from))}</b>${tag && klanSub === 'genel' ? `<span class="ctag">${esc(tag)}</span>` : ''}<span class="muted num">${clock(m.t).replace('bugün ', '')}</span></div><div class="mt">${esc(m.text)}</div></div>`;
}
function liveChat() {
  const log = $('chatlog'); if (!log || !chatRendered.ch) return;
  const ch = chatRendered.ch, msgs = S.chat[ch], lastId = msgs.length ? msgs[msgs.length - 1].id : 0;
  if (lastId === chatRendered.last) return;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60 || !chatRendered.last;
  log.innerHTML = msgs.length ? msgs.map(msgHTML).join('') : '<div class="msg sys">Henüz mesaj yok. İlk selamı sen ver.</div>';
  chatRendered.last = lastId; S.chatSeen[ch] = lastId; if (MPX) LS.set('ub-seen-' + MPX.id, S.chatSeen);
  if (atBottom) log.scrollTop = log.scrollHeight;
}
function klanInfoHTML() {
  const t = now(), clans = C.clanList(), free = S.beys.filter(b => !b.human && !b.clan && S.vil.some(v => v.owner === b.id));
  const pts = o => fmt(C.ownerPts(o));
  const memberRows = ids => ids.map(o => `<div class="mrow"><i class="sw" style="background:${C.ownerColor(o)}"></i><span><b>${esc(o === 'P' ? S.player.name : C.ownerName(o))}</b>${o === 'P' ? ' <span class="muted small">(sen)</span>' : C.isHuman(o) ? ' <span class="ctag">OYUNCU</span>' : ''}</span><span class="num muted small">${pts(o)} puan</span></div>`).join('');
  let h = '<div class="pad">';
  if (S.clan) {
    const mine = clans.find(c => c.mine);
    h += `<section class="card"><div class="klanhead">${SHIELD(S.clan.tag)}<div><h2 class="sec" style="margin:0">${esc(S.clan.name)}</h2><div class="muted small num">[${esc(S.clan.tag)}] · ${mine.m.length}/${C.CLAN_MAX} üye · ${fmt(mine.m.reduce((a, o) => a + C.ownerPts(o), 0))} puan</div></div></div>
      <div>${memberRows(mine.m)}</div>
      <div class="muted small">Klan üyeleri birbirine saldırmaz. Köyüne saldırı geldiğinde müttefiklerin destek askeri gönderebilir.</div></section>`;
    if (!S.clanJoinedAi && mine.m.length < C.CLAN_MAX) {
      h += `<h2 class="sec">Davet et</h2><section class="card">${free.length ? free.map(b => `<div class="mrow"><i class="sw" style="background:${b.color}"></i><span><b>${esc(b.name)}</b><div class="muted small num">${pts(b.id)} puan${b.refusedUntil && t < b.refusedUntil ? ' · ' + dur(b.refusedUntil - t) + ' sonra tekrar' : ''}</div></span><button class="btn sec" data-invite="${b.id}" ${b.refusedUntil && t < b.refusedUntil ? 'disabled' : ''}>Davet et</button></div>`).join('') : '<div class="muted small">Klansız bey kalmadı.</div>'}</section>`;
    }
    h += `<button class="btn red" id="leaveClan" style="justify-self:start">Klandan ayrıl</button>`;
  } else {
    h += `<section class="card"><h2 class="sec" style="margin:0">Klan kur</h2><div class="muted small">Kendi klanını kur, klansız beyleri davet et.</div>
      <form class="form2" id="clanForm"><input id="clanName" maxlength="24" placeholder="Klan adı" aria-label="Klan adı"><input id="clanTag" maxlength="4" placeholder="Kısaltma" aria-label="Klan kısaltması"><button class="btn" type="submit" style="grid-column:1/-1">Klanı kur</button></form></section>`;
    h += `<h2 class="sec">Klanlar</h2>` + clans.map(c => `<section class="card"><div class="klanhead">${SHIELD(c.tag)}<div><b style="font-size:17px">${esc(c.name)}</b><div class="muted small num">[${esc(c.tag)}] · ${c.m.length}/${C.CLAN_MAX} üye · ${fmt(c.m.reduce((a, o) => a + C.ownerPts(o), 0))} puan</div></div></div><div>${memberRows(c.m)}</div>
      <button class="btn sec" data-join="${c.tag}" style="justify-self:start">Katılma isteği gönder</button></section>`).join('');
  }
  return h + '</div>';
}
$('view').addEventListener('click', e => {
  if (tab !== 'klan') return;
  const sb = e.target.closest('[data-sub]'); if (sb) { klanSub = sb.dataset.sub; sig = ''; render(); return; }
  const inv = e.target.closest('[data-invite]');
  if (inv) { const b = S.beys.find(x => x.id === inv.dataset.invite);
    const iid = inv.dataset.invite, r = act(() => C.inviteBey(iid, now()));
    toast(r === 'ok' ? b.name + ' klana katıldı!' : r === 'refused' ? b.name + ' davetini şimdilik reddetti. Güçlendikçe tekrar dene.' : r === 'full' ? 'Klan dolu' : 'Davet gönderilemedi', r === 'ok' ? 'good' : 'bad'); save(); sig = ''; render(); return; }
  const j = e.target.closest('[data-join]');
  if (j) { const tg = j.dataset.join, r = act(() => C.joinClan(tg, now())); toast(r === 'ok' ? 'Klana katıldın!' : r === 'weak' ? 'Klan üyeleri seni henüz yeterince güçlü bulmuyor. Puanını artır.' : r === 'full' ? 'Klan dolu' : 'Katılamadın', r === 'ok' ? 'good' : 'bad'); save(); sig = ''; render(); return; }
  if (e.target.id === 'leaveClan') {
    if (e.target.dataset.armed !== '1') { e.target.dataset.armed = '1'; e.target.textContent = 'Emin misin? Tekrar dokun'; return; }
    act(() => C.leaveClan(now())); toast('Klandan ayrıldın', 'info'); save(); sig = ''; render();
  }
});
$('view').addEventListener('submit', e => {
  if (e.target.id !== 'clanForm') return;
  e.preventDefault();
  const cn = $('clanName').value, ct = $('clanTag').value, r = act(() => C.createClan(cn, ct, now()));
  toast({ ok: 'Klan kuruldu!', name: 'Klan adı en az 3 harf olmalı', tag: 'Kısaltma 2–4 harf olmalı', taken: 'Bu kısaltma kullanılıyor' }[r] || 'Klan kurulamadı', r === 'ok' ? 'good' : 'bad');
  if (r === 'ok') { save(); sig = ''; render(); }
});

// ---------- SIRALAMA ----------
function renderSira() {
  const rows = C.ranking().map((r, i) => `<tr class="${r.id === 'P' ? 'me' : ''}"><td>${i + 1}</td><td style="text-align:left"><i class="sw" style="background:${r.color}"></i> ${esc(r.name)}${r.human ? ' <span class="muted small">(oyuncu)</span>' : ''}${C.clanOf(r.id) ? ` <span class="ctag">${esc(C.clanOf(r.id))}</span>` : ''}</td><td>${r.n}</td><td>${fmt(r.pts)}</td></tr>`).join('');
  const barb = S.vil.filter(v => v.owner === null).length;
  $('view').innerHTML = `<div class="pad"><h2 class="sec">Beylikler sıralaması</h2>
    <section class="card"><div class="tblwrap"><table class="tbl rank num"><thead><tr><th>#</th><th style="text-align:left">Beylik</th><th>Köy</th><th>Puan</th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <div class="muted small">Haritada ${barb} terk edilmiş köy var. Puan, köylerindeki binaların seviyesinden gelir. Rakip beylikler de büyüyor ve boş köyleri fethediyor.</div></div>`;
}

// ---------- sheet ----------
function sheet(html, mount) {
  closeSheet();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) closeSheet(); });
  $('app').appendChild(ov);
  if (mount) mount(ov.firstChild);
}
function closeSheet() { const o = $('ov'); if (o) o.remove(); }
let overShown = false;
function showOver() {
  if (overShown) return; overShown = true;
  const r = C.ranking();
  sheet(`<h3>Beyliğin düştü</h3><div>Son köyün de el değiştirdi. ${esc(r[0].name)} şu an Anadolu'nun en güçlü beyliği.</div>
    <button class="btn" id="overNew">Yeni beylik kur</button>`, () => { $('overNew').onclick = () => { if (MPX) { leaveToMenu(); overShown = false; return; } store.del(); S = null; C.S = null; overShown = false; closeSheet(); showStart(); }; });
  $('ov').classList.add('center');
}

// ---------- canlı güncelleme ----------
function live() {
  const t = now();
  for (const el of document.querySelectorAll('[data-end]')) el.textContent = dur(+el.dataset.end - t);
  for (const el of document.querySelectorAll('[data-e]')) { const s = +el.dataset.s, e = +el.dataset.e; el.style.width = Math.min(100, Math.max(0, (t - s) / (e - s) * 100)) + '%'; }
  liveBSheet();
  if (tab === 'koy') liveKoy();
  if (tab === 'klan') liveChat();
  if (tab === 'ordu') liveOrdu();
  else if (tab === 'harita') mapCard();
}
setInterval(() => {
  if (!S || $('start')) return;
  render();
  if (now() - lastSave > 5000) save();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else if (S) { catching = true; awayLog = []; const t0 = S.lastT; C.processUntil(now()); catching = false; sig = ''; render(); if (now() - t0 > 60000 && awayLog.length) showAway(now() - t0); if (MPX) poll(); } });
addEventListener('pagehide', save);
addEventListener('resize', () => { if (tab === 'harita') { sig = ''; render(); } });

window.__ub = { SC, viewInfo, selectBuilding, clampCam };
boot();
})();
</script>

</body></html>
