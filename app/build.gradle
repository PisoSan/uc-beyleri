plugins {
    id 'com.android.application'
}

// Firebase (anlık bildirim): app/google-services.json eklendiğinde kendiliğinden devreye girer.
// Dosya yoksa APK yine derlenir, oyun bildirimsiz çalışır.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.ahmetkaragoz.ucbeyleri'
    compileSdk 34

    defaultConfig {
        applicationId "com.ahmetkaragoz.ucbeyleri"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger() + 10)
        versionName "0.9." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
