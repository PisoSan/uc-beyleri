plugins {
    id 'com.android.application'
}

// Divan: Uç Beyleri yönetim uygulaması (oyundan ayrı, kendi simgesiyle kurulur)
android {
    namespace 'com.ahmetkaragoz.ucbeyleri.yonetim'
    compileSdk 34

    defaultConfig {
        applicationId "com.ahmetkaragoz.ucbeyleri.yonetim"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger() + 10)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
