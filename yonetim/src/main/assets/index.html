/* Divan: oyunun yönetim uygulaması. Mürekkep zemin, pirinç ve sinoper vurgular; defter düzeni. */
:root{
  --ink:#15110e; --panel:#1e1814; --panel-2:#28201a; --line:#3a2f26; --line-2:#4a3d31;
  --text:#efe4cf; --muted:#a8977f; --brass:#d4a94e; --red:#d2553c; --green:#78c28a; --teal:#4fb3a5;
  --display:'Alegreya SC',Georgia,serif; --body:'Alegreya Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13.5px}
[hidden]{display:none!important}
#app{display:grid;grid-template-columns:1fr;height:100%}
.side{display:none}
main{display:flex;flex-direction:column;min-width:0;height:100%}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,#221b16,#1b1511)}
.bar h1{margin:0;font-family:var(--display);font-size:21px;color:var(--brass);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.bar .crumb{font-size:12.5px;color:var(--muted);font-family:var(--body);display:block;letter-spacing:0}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font-size:22px;line-height:1;display:grid;place-items:center}
.content{flex:1;overflow-y:auto;padding:14px;display:grid;gap:12px;align-content:start;max-width:980px;width:100%;margin:0 auto}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button,.nav button{background:none;border:0;color:var(--muted);padding:9px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700}
.tabbar button svg,.nav button svg{width:22px;height:22px}
.tabbar button.on,.nav button.on{color:var(--brass)}
@media (min-width:860px){
  #app{grid-template-columns:240px 1fr}
  .side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;gap:18px}
  .tabbar,.tabbar.nav,#out2{display:none}
  .nav{display:grid;gap:4px}
  .nav button{grid-template-columns:24px 1fr;justify-items:start;align-items:center;gap:10px;font-size:15.5px;padding:10px 12px;border-radius:10px;text-align:left}
  .nav button.on{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--brass)}
  .content{padding:22px}
}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-family:var(--display);font-size:22px;color:var(--brass);display:block;line-height:1}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.who{margin-top:auto;font-size:13.5px;color:var(--muted);display:grid;gap:6px}
.who b{color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:9px}
.card > b:first-child,.card h2{font-family:var(--display);color:var(--brass);font-size:17.5px;margin:0;font-weight:700}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;background:var(--brass);color:#1a1209;min-height:40px}
.btn.sec{background:var(--panel-2);color:var(--text);border:1px solid var(--line-2)}
.btn.red{background:var(--red);color:#fff}
.btn.teal{background:var(--teal);color:#0d1a18}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;width:100%;min-width:0;font-size:15.5px}
input::placeholder,textarea::placeholder{color:#7d6e5c}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(212,169,78,.5);outline-offset:0}
label.f{display:grid;gap:4px;font-size:13.5px;color:var(--muted);font-weight:700}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-of-type{border-top:0}
button.row:hover{background:rgba(255,255,255,.02)}
.row b{font-weight:800}
.chev{color:var(--muted);font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-size:30px;color:var(--text);line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);font-weight:700}
.tile.warn b{color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14.5px}
.kv span:nth-child(odd){color:var(--muted)} .kv span:nth-child(even){text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:800;padding:8px 10px;border-radius:9px;white-space:nowrap}
.seg button.on{background:var(--panel-2);color:var(--brass)}
.tag{font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;letter-spacing:.04em;white-space:nowrap}
.tag.ban{background:var(--red);color:#fff} .tag.code{color:var(--brass);border:1px solid rgba(212,169,78,.5)} .tag.prot{color:var(--teal);border:1px solid rgba(79,179,165,.5)} .tag.guest{color:var(--muted);border:1px solid var(--line-2)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.err{color:var(--red);font-weight:700;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.toasts{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:50}
.toast{background:#2c241d;border:1px solid var(--line-2);border-left:4px solid var(--brass);border-radius:10px;padding:9px 14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:opacity .3s;max-width:480px}
.toast.good{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
/* giriş */
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,#2a2018,var(--ink) 70%)}
.login .box{width:100%;max-width:380px;display:grid;gap:14px;text-align:center}
.login svg{width:86px;height:86px;margin:0 auto}
.login h1{margin:0;font-family:var(--display);font-size:40px;color:var(--brass);line-height:1}
.login p{margin:0;color:var(--muted)}
.login form{display:grid;gap:10px;text-align:left}
.dlg{position:fixed;inset:0;z-index:80;background:rgba(8,6,4,.7);display:grid;place-items:center;padding:20px}
.dbox{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:16px;display:grid;gap:12px;width:100%;max-width:400px;font-size:16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.login .big{padding:12px;font-size:17px}

const B_PTS = { konak: 10, kereste: 6, tas: 6, demir: 6, ambar: 6, ciftlik: 5, kisla: 16, sur: 8, ahir: 20, tophane: 24, medrese: 18, kervansaray: 10, divan: 512 };

// ---------- birlikler ----------
// a: saldırı, di: piyadeye karşı savunma, dc: süvariye karşı savunma,

const U = {

  akinci:     { n: 'Akıncı',     b: 'ahir',    lv: 1, c: [125, 100, 250],pop: 4,   a: 130, di: 30,  dc: 40,  sp: 10, cr: 80, t: 240,  cls: 'cav', d: 'Hızlı yağmacı, çok ganimet taşır' },
  sipahi:     { n: 'Sipahi',     b: 'ahir',    lv: 5, c: [200, 150, 600],pop: 6,   a: 150, di: 200, dc: 80,  sp: 11, cr: 50, t: 400,  cls: 'cav', d: 'Ağır süvari, hem saldırır hem savunur' },

  sancakbeyi: { n: 'Sancakbeyi', b: 'divan',   lv: 1, c: [15000, 18000, 15000], pop: 100, a: 30, di: 100, dc: 50, sp: 35, cr: 0, t: 3000, cls: 'inf', d: 'Kazanılan her saldırıda bağlılığı 20–35 düşürür' },
};
const U_ORDER = ['mizrakli', 'baltaci', 'okcu', 'casus', 'akinci', 'sipahi', 'mancinik', 'sancakbeyi'];
const REC_B = ['kisla', 'ahir', 'tophane', 'divan'];

const BEY_DEFS = [
  { name: 'Karamanoğulları',  color: '#c9503b', aggr: .85 },
  { name: 'Germiyanoğulları', color: '#8a5cc2', aggr: .6 },

  { name: 'Hamidoğulları',    color: '#b8406f', aggr: .55 },
  { name: 'Candaroğulları',   color: '#7f8f3a', aggr: .65 },
];
const PLACE = ['Karapınar', 'Akçakale', 'Yenice', 'Kızılcaköy', 'Sarıçam', 'Ulubey', 'Gökçeören', 'Taşpınar', 'Çamlıbel', 'Kuyucak',
  'Ortaköy', 'Ilıca', 'Dereköy', 'Hisarcık', 'Akbaş', 'Karahisar', 'Beyören', 'Söğütlü', 'Kavaklı', 'Pınarbaşı', 'Kayalı', 'Güzelyurt',
  'Bademli', 'Çınarlı', 'Eskiköy', 'Yassıören', 'Kırkpınar', 'Bozdağ', 'Alaçam', 'Kozluca', 'Değirmendere', 'Tepecik', 'Karaağaç',
  'Kestanelik', 'Yeşilova', 'Göller', 'Akpınar', 'Çayırlı', 'Sultanhanı', 'Kuşadası', 'Oğuzlar', 'Beypazarı', 'Karacasu', 'Elmalı', 'Ardıçlı'];

const WORLD = 25;

// ---------- seviyeye bağlı bina şartları ----------
function reqFor(b, lvl) {
  const r = Object.assign({}, B[b].req);
  const need = (k, x) => { x = Math.min(x, B[k].max); if (x > 0) r[k] = Math.max(r[k] || 0, x); };
  if (b === 'konak') {
    if (lvl >= 3) for (const m of MINES) need(m, lvl - 1);
    if (lvl >= 4) { need('ambar', lvl - 2); need('ciftlik', lvl - 2); }
    if (lvl >= 5) need('sur', lvl - 4);
    if (lvl >= 6) need('kisla', Math.floor(lvl / 3));
    if (lvl >= 12) need('medrese', Math.floor((lvl - 8) / 2));
  } else if (b === 'medrese') need('konak', 3 + lvl);
  else if (lvl >= 5) need('konak', Math.floor(lvl / 2));
  return r;
}

// ---------- klanlar ve sohbet ----------
// Bu sürümde klan üyeleri ve sohbetteki diğer beyler bilgisayar tarafından yönetilir.
// Online sürümde aynı veri yapısı sunucudan gelen gerçek oyuncu mesajlarıyla dolacak.
const CHAT_MAX = 150, CLAN_MAX = 5;
const AI_CLANS = [{ tag: 'KRM', name: 'Konya Divanı', m: ['B0', 'B5'] }, { tag: 'EGE', name: 'Ege Uçları', m: ['B2', 'B3', 'B4'] }];
function clanOf(o) { if (!o) return null; if (o === 'P') return S.clan ? S.clan.tag : null; const b = beyOf(o); return b ? b.clan || null : null; }
function sameClan(a, b) { const ca = clanOf(a), cb = clanOf(b); return !!ca && ca === cb; }
function clanList() {
  const tags = {};
  for (const b of S.beys) if (b.clan) (tags[b.clan] = tags[b.clan] || { tag: b.clan, name: b.clanName, m: [] }).m.push(b.id);
  if (S.clan) tags[S.clan.tag] = { tag: S.clan.tag, name: S.clan.name, m: ['P', ...S.beys.filter(b => b.clan === S.clan.tag).map(b => b.id)], mine: true };
  return Object.values(tags);
}
function ownerPts(o) { return S.vil.filter(v => v.owner === o).reduce((a, v) => a + vPoints(v), 0); }
function say(ch, from, text, t) {
  const a = S.chat[ch]; a.push({ id: ++S.uid, t, from, text });
  if (a.length > CHAT_MAX) a.splice(0, a.length - CHAT_MAX);
}
const pick = a => a[Math.floor(R() * a.length)];
// tohumlu rastgelelik: aynı durumdan başlayan her cihaz aynı sonucu bulur (çok oyunculu için şart)
function R() { let a = (S.rs = (S.rs + 0x6D2B79F5) | 0); let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
// gerçek oyuncular: yerel oyuncu her zaman 'P'; diğer insanlar beys içinde human:true
const beyOf = o => (o && o !== 'P' ? S.beys.find(x => x.id === o) : null);
const isHuman = o => o === 'P' || !!(beyOf(o) || {}).human;
const protectOf = o => (o === 'P' ? S.protectUntil : ((beyOf(o) || {}).human ? beyOf(o).protectUntil || 0 : 0));
function statsOf(o) { if (o === 'P') return S.stats; const b = beyOf(o); if (!b || !b.human) return null; return b.stats || (b.stats = { trained: {}, barbWins: 0, spies: 0 }); }
const addSt = (o, k, n) => { const st = statsOf(o); if (st && n) st[k] = (st[k] || 0) + n; };
const lastVillage = o => S.vil.filter(v => v.owner === o).length < 2;
const beyShort = o => (o === 'P' ? S.player.name : ownerName(o).replace('oğulları', ''));
function createClan(name, tag, t) {
  name = String(name || '').trim().slice(0, 24); tag = String(tag || '').trim().toUpperCase().replace(/[^A-ZÇĞİÖŞÜ0-9]/g, '').slice(0, 4);
  if (S.clan) return 'already'; if (name.length < 3) return 'name'; if (tag.length < 2 || /^H\d+$/.test(tag)) return 'tag';
  if (S.beys.some(b => b.clan === tag)) return 'taken';
  S.clan = { name, tag, created: t }; S.clanJoinedAi = false;
  if (S.clanChat) S.chat.klan = S.clanChat[tag] = S.clanChat[tag] || [];
  say('genel', 'SYS', S.player.name + ' [' + tag + '] ' + name + ' klanını kurdu.', t);
  say('klan', 'SYS', 'Klan kuruldu. Bağımsız beylere davet göndererek klanını büyüt.', t);
  return 'ok';
}
function inviteBey(id, t) {
  const b = S.beys.find(x => x.id === id);
  if (!S.clan) return 'noclan'; if (!canDo('P', 'invite')) return 'perm'; if (!b || b.clan) return 'taken';
  if (1 + S.beys.filter(x => x.clan === S.clan.tag).length >= CLAN_MAX) return 'full';
  if (b.human) return 'human';
  if (b.refusedUntil && t < b.refusedUntil) return 'wait';
  const ratio = (ownerPts('P') + 1) / (ownerPts(b.id) + 1);
  if (ratio >= .55 && R() < .35 + ratio * .4) {
    b.clan = S.clan.tag; b.clanName = S.clan.name;
    say('klan', b.id, pick(['Davetin için sağ ol beyim, sancağımız bir olsun.', 'Kabul ediyorum. Düşmanımız ortak, ganimetimiz ortak!', 'Bu ittifak iki beyliğe de hayırlı olsun.']), t);
    say('genel', 'SYS', b.name + ', [' + S.clan.tag + '] klanına katıldı.', t);
    return 'ok';
  }
  b.refusedUntil = t + 6 * HOUR / S.speed;
  return 'refused';
}
function joinClan(tag, t) {
  if (S.clan) return 'already';
  const mem = S.beys.filter(b => b.clan === tag); if (!mem.length) return 'none';
  if (mem.length + 1 > CLAN_MAX) return 'full';
  const avg = mem.reduce((a, b) => a + ownerPts(b.id), 0) / mem.length;
  if (!mem.some(b => b.human) && ownerPts('P') < avg * .5) return 'weak';
  S.clan = { name: mem[0].clanName, tag, created: t }; S.clanJoinedAi = true;
  if (S.clanChat) S.chat.klan = S.clanChat[tag] = S.clanChat[tag] || [];
  const greet = mem.find(b => !b.human);
  if (greet) say('klan', greet.id, 'Hoş geldin ' + S.player.name + '! Kışlanı büyüt, sınırlarımızı birlikte koruyalım.', t);
  say('genel', 'SYS', S.player.name + ', [' + tag + '] klanına katıldı.', t);
  return 'ok';
}
function leaveClan(t) {
  if (!S.clan) return 'none';
  const tag = S.clan.tag, others = members(tag).filter(o => o !== 'P'), humans = others.filter(o => isHuman(o)); let gone = false;
  if (leaderOf(tag) === 'P') {
    if (humans.length) {
      // beylik klandaki başka bir oyuncuya geçer (önce vezirler, sonra en güçlü)
      const next = humans.find(o => rankOf(o) === 'vezir') || humans.slice().sort((a, b) => ownerPts(b) - ownerPts(a))[0];
      const m = cmeta(tag, true); m.ranks = m.ranks.filter(x => x.owner !== 'P' && x.owner !== next && x.r !== 'bey'); m.ranks.push({ owner: next, r: 'bey' });
      clog(tag, ownerName(next) + ' klanın yeni beyi oldu.', t);
    } else if (!AI_CLANS.some(c => c.tag === tag)) gone = true;
  }
  if (!gone) { clog(tag, S.player.name + ' klandan ayrıldı.', t); if (S.clanMeta && S.clanMeta[tag]) S.clanMeta[tag].ranks = S.clanMeta[tag].ranks.filter(x => x.owner !== 'P'); }
  else { for (const b of S.beys) if (b.clan === tag && !b.human) { b.clan = null; b.clanName = null; } dissolve(tag); }
  say('genel', 'SYS', S.player.name + ', [' + tag + '] klanından ayrıldı.', t);
  S.clan = null; S.chat.klan = []; return 'ok';
}

// ---------- klan yönetimi: rütbeler, üye atma, diplomasi ----------
// Rütbeler { owner, r } biçiminde tutulur; böylece çok oyunculuda kimlik çevirisi (P ↔ H1) kendiliğinden yapılır.
const RANKS = { bey: 'Klan Beyi', vezir: 'Vezir', uye: 'Üye' }, RANK_ORD = { bey: 3, vezir: 2, uye: 1 };
const RELS = { savas: 'Savaşta', ittifak: 'İttifak', nap: 'Saldırmazlık' };
const PERM = { invite: 2, kick: 2, dipl: 2, rank: 3, desc: 3 };
function members(tag) { const c = clanList().find(x => x.tag === tag); return c ? c.m : []; }
function defaultLeader(tag) {
  const mem = members(tag), ai = AI_CLANS.find(c => c.tag === tag);
  if (ai && mem.includes(ai.m[0])) return ai.m[0];
  const founder = mem.find(o => isHuman(o) && !(o === 'P' ? S.clanJoinedAi : (beyOf(o) || {}).clanJoinedAi));
  return founder || mem.find(o => isHuman(o)) || mem[0] || null;
}
function cmeta(tag, write) {
  S.clanMeta = S.clanMeta || {};
  if (S.clanMeta[tag]) return S.clanMeta[tag];
  const lead = defaultLeader(tag), m = { ranks: lead ? [{ owner: lead, r: 'bey' }] : [], desc: '', log: [], g: {} };
  if (write) S.clanMeta[tag] = m;
  return m;
}
function leaderOf(tag) {
  if (!tag) return null;
  const mem = members(tag), m = cmeta(tag);
  const e = m.ranks.find(x => x.r === 'bey' && mem.includes(x.owner)); if (e) return e.owner;
  // bey ayrıldıysa: vezir oyuncu, sonra herhangi bir oyuncu, sonra bilgisayar beyi
  const vz = m.ranks.find(x => x.r === 'vezir' && mem.includes(x.owner) && isHuman(x.owner)); if (vz) return vz.owner;
  return defaultLeader(tag);
}
function rankOf(o) {
  const tag = clanOf(o); if (!tag) return null;
  if (leaderOf(tag) === o) return 'bey';
  return cmeta(tag).ranks.some(x => x.owner === o && x.r === 'vezir') ? 'vezir' : 'uye';
}
const canDo = (o, a) => { const r = rankOf(o); return !!r && RANK_ORD[r] >= PERM[a]; };
function clog(tag, text, t) {
  if (!tag) return; const m = cmeta(tag, true); m.log.unshift({ t, text }); if (m.log.length > 30) m.log.length = 30;
  if (S.clan && S.clan.tag === tag) say('klan', 'SYS', text, t);
  else if (S.clanChat && S.clanChat[tag]) { S.clanChat[tag].push({ id: ++S.uid, t, from: 'SYS', text }); if (S.clanChat[tag].length > CHAT_MAX) S.clanChat[tag].shift(); }
}
function dissolve(tag) {
  if (S.clanMeta) delete S.clanMeta[tag];
  S.rel = (S.rel || []).filter(r => r.a !== tag && r.b !== tag);
  S.dipl = (S.dipl || []).filter(r => r.fr !== tag && r.to !== tag);
}
function setRank(target, r, t) {
  if (!S.clan) return 'noclan'; if (!canDo('P', 'rank')) return 'perm'; if (target === 'P') return 'self';
  const tag = S.clan.tag; if (!members(tag).includes(target)) return 'none';
  if (!['bey', 'vezir', 'uye'].includes(r)) return 'bad';
  if (r === 'bey' && !isHuman(target)) return 'ai';
  const m = cmeta(tag, true);
  if (!m.ranks.some(x => x.r === 'bey' && x.owner === 'P')) m.ranks.push({ owner: 'P', r: 'bey' });

// ---------- savaş hesaplayıcı (durumu değiştirmez; savaş formülünün aynısı) ----------
function simulate(att, def, wall, luck, aOwner = 'P', dOwner = null) {
  att = Object.assign({}, att); def = Object.assign({}, def);
  let Ai = 0, Ac = 0; for (const [u, n] of Object.entries(att)) { if (!n) continue; if (U[u].cls === 'cav') Ac += U[u].a * n; else if (U[u].cls === 'inf') Ai += U[u].a * n; }
  const A0 = Ai + Ac, rams = att.mancinik || 0, wallEff = Math.max(0, (wall || 0) - Math.floor(rams / 3));
  let Di = 0, Dc = 0; for (const [u, n] of Object.entries(def)) { if (!n || U[u].cls === 'spy') continue; Di += U[u].di * n; Dc += U[u].dc * n; }
  const Dmix = A0 > 0 ? (Di * Ai + Dc * Ac) / A0 : Di;
  const D = (Dmix * (1 + TX(dOwner, 'zirh')) + 20 + 40 * wallEff) * Math.pow(1.037, wallEff * (1 + TX(dOwner, 'burc')));
  const A = A0 * (1 + luck) * (1 + TX(aOwner, 'demirci'));
  const res = { win: A0 > 0 && A > D, A: Math.round(A), D: Math.round(D), aLost: {}, dLost: {}, aLeft: {}, dLeft: {}, wall: [wall || 0, wall || 0], carry: 0 };
  if (res.win) {
    const r = Math.pow(D / A, 1.5);
    for (const [u, n] of Object.entries(att)) { if (!n || u === 'casus') continue; const l = Math.round(n * r); res.aLost[u] = l; res.aLeft[u] = n - l; }
    for (const [u, n] of Object.entries(def)) if (n && u !== 'casus') res.dLost[u] = n;
    if (rams > 0) res.wall[1] = wallEff;
    for (const [u, n] of Object.entries(res.aLeft)) res.carry += U[u].cr * n * (1 + TX(aOwner, 'kervan'));
  } else {
    const r = A0 > 0 ? Math.pow(A / D, 1.5) : 0;
    for (const [u, n] of Object.entries(att)) if (n && u !== 'casus') res.aLost[u] = n;
    for (const [u, n] of Object.entries(def)) { if (!n || u === 'casus') continue; const l = Math.round(n * r); res.dLost[u] = l; res.dLeft[u] = n - l; }
  }
  res.carry = Math.floor(res.carry);
  return res;
}

// ---------- zaman akışı ----------
function nextEvent() {
  let best = { t: Infinity };
  for (const v of S.vil) {
    if (v.bq.length && v.bq[0].done < best.t) best = { t: v.bq[0].done, k: 'b', v };
    for (const b of REC_B) { const q = v.rq[b]; if (q.length && q[0].next < best.t) best = { t: q[0].next, k: 'u', v, b }; }
  }
  for (const m of S.moves) if (m.arrive < best.t) best = { t: m.arrive, k: 'm', m };
  if (S.nextAi < best.t) best = { t: S.nextAi, k: 'ai' };
  if (S.techq && S.techq.done < best.t) best = { t: S.techq.done, k: 'tech' };
  for (const b of S.beys) if (b.techq && b.techq.done < best.t) best = { t: b.techq.done, k: 'htech', b };
  if (S.nextChat < best.t) best = { t: S.nextChat, k: 'chat' };
  for (const c of S.chatq) if (c.t < best.t) best = { t: c.t, k: 'chatq', c };
  return best;
}
function processUntil(now) {

    const e = nextEvent(); if (e.t > now) break;
    n++;

      const v = e.v, q = v.bq.shift(); syncRes(v, e.t); v.b[q.b] = q.lvl;
      if (v.owner === 'P') hooks.notify('build', v.name + ': ' + B[q.b].n + ' ' + q.lvl + '. seviye');
    } else if (e.k === 'u') {
      const v = e.v, q = v.rq[e.b], it = q[0];
      v.units[it.u] = (v.units[it.u] || 0) + 1; it.n--;
      const st = statsOf(v.owner); if (st) st.trained[it.u] = (st.trained[it.u] || 0) + 1;
      if (it.n <= 0) { q.shift(); if (q.length) q[0].next = e.t + q[0].each; } else it.next += it.each;
    } else if (e.k === 'm') {

    } else if (e.k === 'chat') {
      S.nextChat = e.t + (45 + R() * 100) * 1000;
      aiChat(e.t, now - e.t < 15 * 60000);
    } else if (e.k === 'chatq') {
      S.chatq.splice(S.chatq.indexOf(e.c), 1); say(e.c.ch, e.c.from, e.c.text, e.t);
      if (S.pendingRes) { S.pendingRes = false; allyResources(e.t); }
      if (S.pendingSupport) { S.pendingSupport = false; const v = S.vil.find(x => x.owner === 'P'); if (v) allySupport(v, S.beys[0].id, e.t); S.chat.klan.pop(); }
    } else if (e.k === 'tech') {
      const q = S.techq; S.techq = null; S.tech[q.id] = q.lvl;
      hooks.notify('good', 'Araştırma bitti: ' + TECH[q.id].n + ' ' + q.lvl + '. seviye');
    } else if (e.k === 'htech') {

    }
    if (S.over && !S.mp) break;
  }
  S.lastT = now;
  return n;
}

function ownerName(o) { if (o === 'P') return S.player.name; if (o === null) return 'Terk edilmiş'; const b = beyOf(o); return b ? b.name : '?'; }
function ownerColor(o) { if (o === 'P') return S.player.color; if (o === null) return '#8d8a80'; const b = beyOf(o); return b ? b.color : '#888'; }

// ============================================================

const AI = (() => {

      else if (b === 'tophane') s = K * 0.3 - l;
      else if (b === 'divan') s = 8;
      else if (b === 'medrese') s = K * 0.3 - l;
      else if (b === 'kervansaray') s = K * 0.2 - l;

      if (B[b].pop > pm - used && b !== 'ciftlik') continue;

  }
  function mix(v, bey) {

    if (unitUnlocked(v, 'baltaci')) w.push(['baltaci', 0.6 + 2.4 * bey.aggr]);
    if (unitUnlocked(v, 'akinci')) w.push(['akinci', 1.6 * bey.aggr]);

    if (unitUnlocked(v, 'mancinik')) w.push(['mancinik', 0.25]);

  function pickW(w) { const tot = w.reduce((a, x) => a + x[1], 0); let r = R() * tot; for (const [k, x] of w) { r -= x; if (r <= 0) return k; } return w.length ? w[w.length - 1][0] : null; }

  function village(v, t, bey) {

  const d = Math.floor(s / 86400); s %= 86400; const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60);
  if (d) return d + 'g ' + h + 'sa'; if (h) return h + 'sa ' + m + 'dk'; return m + 'dk';
}
function clock(t) {
  const d = new Date(t), n = new Date(), hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((day(d) - day(n)) / 86400000);
  if (diff === 0) return 'bugün ' + hm; if (diff === -1) return 'dün ' + hm; if (diff === 1) return 'yarın ' + hm;
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear() + ' ' + hm;
}
function toast(msg, kind = 'info') {
  const box = $('toasts'); if (box.children.length > 2) box.firstChild.remove();
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg; box.appendChild(el);
  setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.remove(), 320); }, 2800);
}
function netErr(e) {
  const m = (e && e.message) || '';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.';
  if (/Yetkin yok/.test(m)) return 'Bu hesabın yönetim yetkisi yok.';
  if (/function .* does not exist|schema cache/i.test(m)) return 'Yönetim SQL kurulumu eksik (20261002000000_yonetim.sql).';
  return m || 'Bir şeyler ters gitti';
}

async function edit(wid, fn) {
  for (let i = 0; i < 6; i++) {
    const R = await Net.admin.load(wid), t = T();
    C.S = R.W; const out = fn(R.W, t);

    const v = await Net.admin.save(wid, R.W, R.version);

  }

}

  document.querySelector('.bar h1').innerHTML = `${esc(p.name)}<span class="crumb">${esc(R.name)} · ${esc(R.code)}</span>`;
  const st = (b && b.stats) || {}, vils = W.vil.filter(v => v.owner === hid);
  c.innerHTML = `<section class="card"><h2>Kimlik</h2><div class="kv"><span>Kullanıcı adı</span><span>${p.username ? '@' + esc(p.username) : 'misafir'}</span><span>Dünyadaki kimlik</span><span>${esc(hid)}</span><span>Klan</span><span>${b && b.clan ? '[' + esc(b.clan) + '] ' + esc(b.clanName || '') : '—'}</span><span>Köy</span><span>${vils.length}</span><span>Puan</span><span>${fmt(ptsOf(W, hid))}</span><span>Katılma</span><span>${clock(Date.parse(p.joined_at))}</span><span>Koruma</span><span>${b && b.protectUntil > T() ? dur(b.protectUntil - T()) + ' kaldı' : 'yok'}</span><span>Durum</span><span style="color:${p.banned ? 'var(--red)' : 'var(--green)'}">${p.banned ? 'Yasaklı' + (p.ban_until ? ' · ' + clock(Date.parse(p.ban_until)) + "'e kadar" : ' · kalıcı') : 'Aktif'}</span></div></section>
    <section class="card"><h2>İstatistik</h2><div class="kv"><span>Öldürdüğü asker</span><span>${fmt(st.kills)}</span><span>Kaybettiği asker</span><span>${fmt(st.lost)}</span><span>Fethettiği köy</span><span>${fmt(st.conq)}</span><span>Kaybettiği köy</span><span>${fmt(st.lostVil)}</span><span>Kazandığı saldırı</span><span>${fmt(st.wins)}</span><span>Yağmaladığı kaynak</span><span>${fmt(st.loot)}</span></div></section>
    ${p.banned ? `<section class="card"><h2>Yasak</h2><div class="muted small">${esc(p.ban_reason || 'Sebep yazılmamış')}</div><div class="chips"><button class="btn teal" id="unban">Yasağı kaldır</button></div></section>`
      : `<section class="card"><h2>Yasakla</h2><div class="muted small">Yasaklı oyuncu hiçbir dünyaya giremez, dünya kuramaz, katılamaz; bildirimleri kesilir. Sebep oyuncuya gösterilir.</div><input id="why" maxlength="200" placeholder="Sebep, örn. hile, hakaret"><div class="chips"><button class="btn red" data-ban="24">1 gün</button><button class="btn red" data-ban="168">7 gün</button><button class="btn red" data-ban="720">30 gün</button><button class="btn red" data-ban="0">Kalıcı</button></div></section>`}
    <section class="card"><h2>Bütün köylerine kaynak</h2><div class="chips"><button class="btn sec" data-res="1000">+1.000</button><button class="btn sec" data-res="10000">+10.000</button><button class="btn sec" data-res="100000">+100.000</button></div></section>
    <section class="card"><h2>Koruma</h2><div class="chips"><button class="btn sec" data-prot="24">24 saat ver</button><button class="btn sec" data-prot="72">3 gün ver</button><button class="btn sec" data-prot="0">Kaldır</button></div></section>
    <section class="card"><h2>Köyleri</h2>${vils.map(v => `<button class="row" data-v="${v.id}"><span><b>${esc(v.name)}</b> <span class="muted num">(${v.x}|${v.y})</span><div class="muted small num">${fmt(C.vPoints(v))} puan · ${v.res.map(fmt).join(' / ')}</div></span><span class="chev">›</span></button>`).join('') || '<div class="empty">Köyü yok.</div>'}</section>
    <section class="card"><h2>Dünyadan çıkar</h2><div class="muted small">Köyleri terk edilmiş köye döner, ordusu dağılır. Kodla tekrar katılabilir; engellemek için yasakla.</div><div class="chips"><button class="btn red" id="kick">Dünyadan çıkar</button></div></section>`;
  c.onclick = async e => {
    const v = e.target.closest('[data-v]'); if (v) { go({ v: 'koy', top: route.top, wid, vid: +v.dataset.v }); return; }
    const bn = e.target.closest('[data-ban]'); if (bn) { const hr = +bn.dataset.ban; if (!(await ask(p.name + ' ' + (hr ? Math.round(hr / 24) + ' gün' : 'kalıcı olarak') + ' yasaklansın mı?', { ok: 'Yasakla', danger: true }))) return; run(() => Net.admin.ban(p.user_id, $('why').value.trim(), hr), p.name + ' yasaklandı', draw); return; }
    if (e.target.id === 'unban') { run(() => Net.admin.unban(p.user_id), 'Yasak kaldırıldı', draw); return; }
    const rs = e.target.closest('[data-res]'); if (rs) { const n = +rs.dataset.res; run(() => edit(wid, (W2, t) => { for (const vv of W2.vil) if (vv.owner === hid) addRes(vv, n, t); }), 'Kaynak eklendi', draw); return; }
    const pr = e.target.closest('[data-prot]'); if (pr) { const hr = +pr.dataset.prot; run(() => edit(wid, (W2, t) => { const bb = beyOf(W2, hid); if (!bb) return false; bb.protectUntil = hr ? t + hr * 3600000 : 0; }), hr ? 'Koruma verildi' : 'Koruma kaldırıldı', draw); return; }
    if (e.target.id === 'kick') {
      if (!(await ask(p.name + ' dünyadan çıkarılsın mı?', { ok: 'Çıkar', danger: true }))) return;
      run(async () => {
        await edit(wid, (W2, t) => {
          for (const vv of W2.vil) if (vv.owner === hid) { vv.owner = null; vv.base = Object.assign({}, vv.units); vv.bq = []; }
          for (const vv of W2.vil) if (vv.sup) vv.sup = vv.sup.filter(x => x.owner !== hid);
          W2.moves = W2.moves.filter(m => m.owner !== hid);
          W2.beys = W2.beys.filter(bb => bb.id !== hid);
          W2.chat.genel.push({ id: ++W2.uid, t, from: 'SYS', text: p.name + ' dünyadan çıkarıldı.' });
        });
        await Net.admin.kick(wid, hid);
      }, p.name + ' dünyadan çıkarıldı', back);
    }
  };
}

// ---------- köy ----------
async function vKoy() {
  const { wid, vid } = route;
  const c = shell('Köy');
  let R; try { R = await Net.admin.load(wid); } catch (e) { fail(c, e); return; }
  const W = R.W; C.S = W; const v = W.vil[vid]; C.syncRes(v, T()); const cap = C.cap(v);
  document.querySelector('.bar h1').innerHTML = `${esc(v.name)}<span class="crumb">(${v.x}|${v.y}) · ${esc(ownerName(W, v.owner))} · ${esc(R.name)}</span>`;
  const owners = [['', 'Terk edilmiş'], ...W.beys.map(b => [b.id, b.name + (b.human ? ' (oyuncu)' : '')])];
  c.innerHTML = `<div class="tiles"><div class="tile"><b>${fmt(v.res[0])}</b><span>kereste</span></div><div class="tile"><b>${fmt(v.res[1])}</b><span>taş</span></div><div class="tile"><b>${fmt(v.res[2])}</b><span>demir</span></div><div class="tile"><b>${fmt(cap)}</b><span>ambar sınırı</span></div><div class="tile"><b>${Math.floor(v.loy)}</b><span>bağlılık</span></div><div class="tile"><b>${fmt(C.vPoints(v))}</b><span>puan</span></div></div>
    <section class="card"><h2>Kaynak ekle</h2><div class="g3"><input type="number" id="r0" placeholder="kereste" inputmode="numeric"><input type="number" id="r1" placeholder="taş" inputmode="numeric"><input type="number" id="r2" placeholder="demir" inputmode="numeric"></div>
      <div class="chips"><button class="btn" id="radd">Ekle</button><button class="btn sec" data-q="10000">Hepsine +10.000</button><button class="btn sec" id="rfill">Ambarı doldur</button><button class="btn sec" id="rzero">Sıfırla</button></div><div class="muted small">En fazla ambar sınırının 50 katı tutulabilir.</div></section>
    <section class="card"><h2>Askerler</h2><div class="muted small num">${C.U_ORDER.filter(u => v.units[u] > 0).map(u => fmt(v.units[u]) + ' ' + C.U[u].n).join(' · ') || 'Köyde asker yok'}${(v.sup || []).length ? '<br>Destek: ' + v.sup.map(x => ownerName(W, x.owner) + ' ' + fmt(Object.values(x.units).reduce((a, b) => a + b, 0))).join(', ') : ''}</div>
      <div class="g2"><select id="un">${C.U_ORDER.map(u => `<option value="${u}">${C.U[u].n} (${fmt(v.units[u] || 0)})</option>`).join('')}</select><input type="number" id="uc" placeholder="adet" inputmode="numeric"></div>
      <div class="chips"><button class="btn" data-u="add">Ekle</button><button class="btn sec" data-u="set">Bu sayıya ayarla</button><button class="btn sec" data-u="clear">Bütün askerleri sil</button></div></section>
    <section class="card"><h2>Binalar</h2><div class="g2"><select id="bk">${C.B_ORDER.map(k => `<option value="${k}">${C.B[k].n} (Sv. ${v.b[k] || 0} / ${C.B[k].max})</option>`).join('')}</select><input type="number" id="bl" placeholder="seviye" inputmode="numeric"></div>
      <div class="chips"><button class="btn" id="bset">Seviyeyi ayarla</button><button class="btn sec" id="bmax">Bütün binalar son seviye</button></div></section>
    <section class="card"><h2>Sahip ve bağlılık</h2><div class="g2"><select id="own">${owners.map(([id, n]) => `<option value="${id}" ${String(v.owner || '') === id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select><button class="btn sec" id="oset">Sahibi değiştir</button></div>
      <div class="chips"><button class="btn sec" id="loy">Bağlılığı 100 yap</button></div></section>`;
  const num = id => Math.max(0, Math.floor(+($(id).value || 0)));
  const ed = (fn, msg) => run(() => edit(wid, (W2, t) => { const vv = W2.vil[vid]; C.syncRes(vv, t); return fn(vv, W2, t); }), msg, draw);
  c.onclick = async e => {
    const id = e.target.id;
    if (id === 'radd') { const a = [num('r0'), num('r1'), num('r2')]; if (a.some(x => x)) ed((vv, W2, t) => addRes(vv, a, t), 'Kaynak eklendi'); }
    const q = e.target.closest('[data-q]'); if (q) { const n = +q.dataset.q; ed((vv, W2, t) => addRes(vv, n, t), 'Kaynak eklendi'); }
    if (id === 'rfill') ed(vv => { const cc = C.cap(vv); vv.res = vv.res.map(x => Math.max(x, cc)); }, 'Ambar dolduruldu');
    if (id === 'rzero') { if (await ask('Kaynaklar sıfırlansın mı?', { danger: true })) ed(vv => { vv.res = [0, 0, 0]; }, 'Kaynaklar sıfırlandı'); }
    const u = e.target.closest('[data-u]');
    if (u) { const k = u.dataset.u, un = $('un').value, n = num('uc');
      if (k === 'add' && !n) return; if (k === 'clear' && !(await ask('Köydeki bütün askerler silinsin mi?', { danger: true }))) return;
      ed(vv => { if (k === 'clear') vv.units = {}; else vv.units[un] = k === 'add' ? (vv.units[un] || 0) + n : n; if (vv.owner === null) vv.base = Object.assign({}, vv.units); }, k === 'clear' ? 'Askerler silindi' : 'Askerler güncellendi'); }
    if (id === 'bset') { const k = $('bk').value, l = Math.min(C.B[k].max, num('bl')); ed(vv => { vv.b[k] = l; vv.bq = vv.bq.filter(x => x.b !== k); }, C.B[k].n + ' ' + l + '. seviye'); }
    if (id === 'bmax') ed(vv => { for (const k of C.B_ORDER) vv.b[k] = C.B[k].max; vv.bq = []; }, 'Bütün binalar son seviyede');
    if (id === 'loy') ed(vv => { vv.loy = 100; }, 'Bağlılık 100');
    if (id === 'oset') { const o = $('own').value || null; if (!(await ask('Köyün sahibi "' + ownerName(W, o) + '" yapılsın mı?'))) return;
      ed((vv, W2, t) => { if (vv.owner === o) return false; vv.owner = o; vv.loy = 100; vv.lt = t; vv.bq = []; vv.base = o === null ? Object.assign({}, vv.units) : null; W2.chat.genel.push({ id: ++W2.uid, t, from: 'SYS', text: vv.name + ' köyü yönetim kararıyla ' + ownerName(W2, o) + ' beyliğine geçti.' }); }, 'Sahip değiştirildi'); }
  };
}

// ---------- açılış ----------
(async () => {
  if (!Net.hasAuth) { showLogin(); return; }
  try { if (await Net.amAdmin()) { start(); return; } await Net.logout(); showLogin('Bu hesabın yönetim yetkisi yok'); }
  catch (e) { showLogin(netErr(e)); }
})();
</script>

</body></html>
